name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Cache checksum-pinned arXiv PDFs
        uses: actions/cache@v4
        with:
          path: backend/evaluation/arxiv_corpus/pdfs
          key: arxiv-pdfs-${{ hashFiles('backend/evaluation/arxiv_corpus/checksums.json') }}
      - name: Rebuild checksum-pinned arXiv benchmark
        working-directory: backend
        run: |
          python evaluation/arxiv_corpus/download_papers.py
          python evaluation/arxiv_corpus/extract_corpus.py
          python evaluation/arxiv_corpus/build_dataset.py
      - name: Run tests with coverage
        # Coverage is scoped to production modules by pyproject.toml; tests and
        # generated artifacts are intentionally excluded from the denominator.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=64
      - name: Run retrieval evaluation
        working-directory: backend
        run: python -m evaluation.run --k 5

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
