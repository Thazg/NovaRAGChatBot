name: Bug report
description: Report a reproducible application or developer-workflow problem.
body:
  - type: markdown
    attributes:
      value: Do not include private documents, account exports, tokens or secrets. Follow SECURITY.md for security-sensitive findings.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the affected workflow and what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic input that can be shared safely.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and runtime mode
      description: Commit, OS/browser, provider type, and local JSON vs PostgreSQL/Redis/B2 mode. Include redacted error text or request ID when available.
    validations:
      required: true
