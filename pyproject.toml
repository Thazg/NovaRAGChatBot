[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
norecursedirs = [".git", ".pytest-tmp", "pytest_tmp", "node_modules", "test-results"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
