services:
  - type: web
    name: nova-backend
    runtime: python
    pythonVersion: "3.12"
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 2.1.0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 600
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: 2592000
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        value: https://novachatbot.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: '^https://nova-ai-agent(?:-[a-z0-9-]+)?-thazg-s-projects\.vercel\.app$'
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.05
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 120
      - key: AUTH_RATE_LIMIT_REQUESTS
        value: 10
      - key: TOP_K
        value: 5
      - key: RETRIEVAL_MODE
        value: bm25
      - key: MIN_SIMILARITY_SCORE
        value: 0.12
      - key: PYTHONPATH
        value: /app/backend
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        value: nova-ai-storage
      - key: B2_ENDPOINT
        value: https://s3.us-west-004.backblazeb2.com
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310
      - key: MAX_PDF_OBJECTS
        value: 100000
      - key: MAX_PDF_DECOMPRESSED_STREAM_BYTES
        value: 10485760
      - key: MAX_PDF_EXTRACTED_CHARS
        value: 5000000
      - key: MALWARE_SCAN_REQUIRED
        value: false
