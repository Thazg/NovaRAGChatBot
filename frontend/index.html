<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nova-2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=nova-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080914" />
    <meta name="description" content="Nova AI Agent — a private knowledge workspace for searching, understanding, and chatting with your documents." />
    <title>Nova AI — Make your knowledge come alive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('rag-chat-storage'))?.state?.theme; } catch(e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.add(theme);
        } else {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
