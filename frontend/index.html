<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nova-2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=nova-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080914" />
    <meta name="description" content="Nova RAG Workspace – a private document workspace for searching, understanding, and chatting with your documents." />
    <title>Nova RAG Workspace</title>
    <script>
      (function() {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('rag-chat-storage'))?.state?.theme; } catch(e) {}
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.add(theme);
        } else {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
